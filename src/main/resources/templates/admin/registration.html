<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Registration</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>

<div class="container">

    <h1 th:text="${event.eventName}"></h1>

    <p>

        <strong>Date:</strong>

        <span th:text="${event.date}"></span>

    </p>

    <p>

        <strong>Time:</strong>

        <span th:text="${event.time}"></span>

    </p>

    <p>

        <strong>Address:</strong>

        <span th:text="${event.address}"></span>

    </p>

    <p>

        <strong>Important Information</strong>

    </p>

    <p th:text="${event.importantInformation}"></p>

    <hr>

    <h2>

        Registration Form

    </h2>

</div>

</body>

</html>
