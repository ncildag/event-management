<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Create Event</title>
</head>

<body>

<h1>Create Event</h1>

<form th:action="@{/admin/events/create}"
      th:object="${event}"
      method="post">

    <div>
        <label>Event Name:</label>
        <input type="text"
               th:field="*{eventName}">
    </div>

    <br>

    <div>
        <label>Date:</label>
        <input type="date"
               th:field="*{date}">
    </div>

    <br>

    <div>
        <label>Time:</label>
        <input type="time"
               th:field="*{time}">
    </div>

    <br>

    <div>
        <label>Address:</label>
        <input type="text"
               th:field="*{address}">
    </div>

    <div>
        <label>Important Information:</label>
        <br>
        <textarea th:field="*{importantInformation}"
                  rows="5"
                  cols="50"
                  placeholder="Enter important information for participants...">
    </textarea>
    </div>

    <br>

    <div>
        <label>
            <input type="checkbox"
                   th:field="*{veganOptionEnabled}">
            Ask for vegan menu information
        </label>
    </div>

    <!-- Guest age options -->
    <div>
        <label>
            <input type="checkbox"
                   id="askChild"
                   th:field="*{askChild}"
                   onchange="handleChildOption()">
            Ask if guest is a child under 10 years old
        </label>
    </div>

    <div id="underThreeOption"
         style="margin-left: 25px;"
         th:style="${event.askChild} ? 'margin-left:25px;' : 'margin-left:25px; display:none;'">

        <label>
            <input type="checkbox"
                   id="askUnderThree"
                   th:field="*{askUnderThree}">
            Ask if child is under 3 years old
        </label>

    </div>

    <br>

    <br>

    <div>
        <label>Number of Attendees:</label>
        <input type="number"
               th:field="*{numberOfAttendees}">
    </div>

    <br>

    <div>
        <label>Final Acceptance Date:</label>
        <input type="datetime-local"
               th:field="*{finalAcceptanceDate}">
    </div>

    <br>

    <button type="submit">
        Create Event
    </button>

</form>

<script>
    function handleChildOption() {

        const askChild =
            document.getElementById("askChild");

        const askUnderThree =
            document.getElementById("askUnderThree");

        const underThreeOption =
            document.getElementById("underThreeOption");

        if (askChild.checked) {

            underThreeOption.style.display = "block";

        } else {

            // If child question is disabled,
            // under 3 cannot remain enabled.
            askUnderThree.checked = false;

            underThreeOption.style.display = "none";
        }
    }

    document.addEventListener("DOMContentLoaded", function () {
        handleChildOption();
    });
</script>

</body>
</html>
